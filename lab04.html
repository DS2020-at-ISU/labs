# Lab #4: Scraping (into) the Hall of Fame

---

# Big Picture Goal

Let's assume we are checking and validating the Hall of Fame 2026 data using online data and the Lahman database.

In this activity we are going to

1. identify suitable websites with data on Baseball's Hall of Fame

2. write web scrapers with the goal to

   a. automate the download process,
   b. and - as much as possible - clean the data automatically, or at least identify potential problems, to, finally,
   c. use the scrapers in future years

3. use the scraper to get data for the year 2026.

4. compare the scraped data to the `HallOfFame` table in the `Lahman` package.

5. document the process.

The deliverables are (1) individual reports (Rmd) and (2) the dataset.

# Data Background

The Lahman data package is based on [Sean Lahman](https://www.seanlahman.com/)'s  Baseball  [Database](https://www.seanlahman.com/baseball-archive/statistics/).

The `HallOfFame` table does contain some Hall of Fame data for 2026. You can compare your scraped data with the 2026 data to see what matches and what does not match.

## Baseball Reference

The site baseball-reference.com has grown out of Sean Lahman's work and is now maintained independently.

Incidentally, it also has tables with Hall of Fame information, e.g. for 2026:

[https://www.baseball-reference.com/awards/hof_2026.shtml](https://www.baseball-reference.com/awards/hof_2026.shtml)

---

# Important note

The Baseball Reference page and the Lahman `HallOfFame` table do not have to match row-for-row.

Baseball Reference shows the full BBWAA ballot for 2026.

The Lahman `HallOfFame` table stores official Hall of Fame voting records in a different format, and it may include different voting bodies.

This means that your scraped data may have more rows than the Lahman data for 2026.

That is okay.

Part of the goal is to understand how the two data sources are structured and where they differ.

# Variable Names in Line 1

&lt;!-- Write the dataset into a temporary file, and read the data back in (using the command `read_csv`) and skipping the first line: --&gt;

Obtain the column names from the first line as a variable. Overwrite the column names with the actual column names. Then delete the first line.


``` r
data &lt;- tables[[1]]
actual_col_names &lt;- data[1, ]
colnames(data) &lt;- actual_col_names
data &lt;- data[-1, ]
head(data, 3)
```

---

# Check variable types

The code below is just an example. Make sure that all numeric variables are indeed numeric.


``` r
data$Votes &lt;- as.numeric(data$Votes)
```

For percentages, `parse_number` is useful:


``` r
data$percent_vote &lt;- readr::parse_number(data$`%vote`)
```

---

# Possible cleaning step

After scraping the 2026 table, one possible cleaned version might look something like this:


``` r
hof_2026 &lt;- data %&gt;% 
  select(Name, Votes, `%vote`) %&gt;% 
  mutate(
    yearID = 2026,
    Votes = as.numeric(Votes),
    percent_vote = readr::parse_number(`%vote`),
    inducted = ifelse(percent_vote &gt;= 75, "Y", "N")
  )
```

This is only a starting point. You may need to adjust your code depending on how your scraped table is structured.

# Functions you might need

**`parse_number`** from the `readr` package


``` r
readr::parse_number(c("34%", "10th", "1.0"))
```

```
## [1] 34 10  1
```

**`gsub`** from R base:

Usage `gsub(pattern, replacement, x)`:  replace all occurrences of `pattern` in vector `x` by the string `replacement`.


``` r
x &lt;- c("David Ortiz", "X-Barry Bonds", "X-Roger Clemens")

gsub("X-", "Oh no! ", x)
```

```
## [1] "David Ortiz"          "Oh no! Barry Bonds"   "Oh no! Roger Clemens"
```

``` r
gsub("X-", "", x)
```

```
## [1] "David Ortiz"   "Barry Bonds"   "Roger Clemens"
```

# Comparing Data sets

You can compare your scraped data to the Lahman data for 2026.


``` r
lahman_2026 &lt;- HallOfFame %&gt;% 
  filter(yearID == 2026)

hof_2026 %&gt;% 
  count(inducted)

lahman_2026 %&gt;% 
  count(votedBy, inducted)
```

Remember that the two sources may not match exactly because they are not organized in exactly the same way.

---

# Combining Data sets

If two data frames have the same variable names, we can use the command **`rbind`** (row bind) to concatenate them.


``` r
x1 &lt;- data.frame(id=1:2, name=c("A", "B"))
x2 &lt;- data.frame(id=3:4, name=c("C", "D"))

rbind(x1, x2)
```

```
##   id name
## 1  1    A
## 2  2    B
## 3  3    C
## 4  4    D
```

``` r
dframe &lt;- rbind(x1, x2)
```

Don't forget to save the result!

---

# Exporting csv files

**`write.csv`** writes a data frame into a comma-separated values file (extension csv):


``` r
write.csv(dframe, file="some-file.csv", row.names = FALSE)
```

Make sure to not export the row names, otherwise each successive read &amp; write of the file adds another column in the front.

**`write_csv`** is not part of base, but faster, and does not convert special characters into `.`


``` r
readr::write_csv(dframe, file="some-other-file.csv")
```
